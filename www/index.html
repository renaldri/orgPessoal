<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Organizador</title>
<script src="Sortable.min.js"></script>
<style>
:root{--bg:#F3F4F6;--tx:#1F2937;--mu:#6B7280;--pr:#3B82F6}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--tx);overflow:hidden}
.hd{background:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tg{display:flex;background:var(--bg);border-radius:20px;padding:4px}
.tg button{background:none;border:none;padding:8px 14px;border-radius:16px;font-weight:600;color:#9CA3AF;font-size:.95rem}
.tg button.on{background:#fff;color:var(--pr);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hb button{background:none;border:none;font-size:1.3rem;padding:6px}
#board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 14px 90px;gap:16px;height:calc(100vh - 64px - env(safe-area-inset-top));align-items:flex-start}
#board::-webkit-scrollbar{display:none}
.card{min-width:85vw;scroll-snap-align:center;border-radius:12px;padding:16px;border:1px solid #E5E7EB;box-shadow:0 4px 15px rgba(0,0,0,.05);flex-shrink:0;max-height:100%;overflow-y:auto}
.c-default{background:#fff}.c-blue{background:#EFF6FF;border-color:#BFDBFE}.c-green{background:#F0FDF4;border-color:#BBF7D0}.c-yellow{background:#FEFCE8;border-color:#FEF08A}.c-red{background:#FEF2F2;border-color:#FECACA}.c-purple{background:#FAF5FF;border-color:#E9D5FF}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tt{font-size:1.25rem;font-weight:700;background:none;border:none;width:85%;outline:none;color:var(--tx)}
.mb{background:none;border:none;font-size:1.4rem;color:var(--mu)}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.it{border:1px solid #E5E7EB;border-radius:10px;padding:10px}.it.cp{padding:8px 10px;border-radius:8px}
.a-blue{background:#DBEAFE;border-color:#93C5FD}.a-green{background:#D1FAE5;border-color:#6EE7B7}.a-yellow{background:#FEF08A;border-color:#FDE047}.a-red{background:#FEE2E2;border-color:#FCA5A5}.a-purple{background:#F3E8FF;border-color:#D8B4FE}.a-default{background:#fff}
.it.done{opacity:.6;background:#F9FAFB!important;border-color:#E5E7EB!important}
.it.done .in{text-decoration:line-through;color:#9CA3AF}
.ghost{opacity:.3}
.row{display:flex;align-items:center;gap:10px}
.dh{color:#9CA3AF;padding:4px;font-size:1.2rem;touch-action:none;cursor:grab}
.ck{width:22px;height:22px;accent-color:#10B981;flex-shrink:0}
.in{background:none;border:none;font-size:1rem;font-weight:500;flex:1;min-width:0;outline:none;color:var(--tx)}
.tl{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;border-top:1px dashed rgba(0,0,0,.1);padding-top:8px}
.ib{background:rgba(0,0,0,.05);border:none;border-radius:6px;width:34px;height:34px;font-size:1rem}
.ib.on{background:#FFEDD5;border:1px solid #FDBA74}
.nt{display:none;margin-top:8px}.nt.show{display:block}
textarea{width:100%;border:1px solid rgba(0,0,0,.1);border-radius:6px;padding:10px;font-size:.9rem;resize:none;background:rgba(255,255,255,.8);outline:none}
.add{background:none;border:2px dashed #D1D5DB;border-radius:8px;width:100%;color:var(--mu);font-weight:600;padding:12px}
.fast{width:100%;padding:12px;border:1px solid #D1D5DB;border-radius:8px;font-size:1rem;outline:none}
.gn{display:none;margin-top:14px;background:rgba(255,255,255,.6);padding:10px;border-radius:8px}.gn.show{display:block}
.gn textarea{height:80px;border:none;background:none}
.empty{width:100%;text-align:center;padding-top:50px;color:#9CA3AF}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-end;padding-bottom:20px}
.mc{background:#fff;padding:22px;border-radius:16px;width:90%;max-width:350px}
.mc h3{text-align:center;margin-bottom:16px}
.mc button{width:100%;padding:14px;margin-bottom:8px;border:none;background:var(--bg);border-radius:8px;font-size:1rem;font-weight:600;text-align:left;color:var(--tx)}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:22px;background:var(--pr);color:#fff;border:none;border-radius:16px;width:60px;height:60px;font-size:28px;box-shadow:0 4px 15px rgba(59,130,246,.4);z-index:50}
@media(min-width:768px){#board{scroll-snap-type:none}.card{min-width:380px;max-width:380px}.modal{align-items:center}}
</style></head><body>
<div class="hd">
  <div class="tg"><button id="v-tarefa" class="on" onclick="view('tarefa')">✅ Tarefas</button><button id="v-compra" onclick="view('compra')">🛒 Compras</button></div>
  <div class="hb"><button onclick="exportar()" title="Exportar backup">⬇️</button><button onclick="document.getElementById('imp').click()" title="Importar backup">⬆️</button></div>
</div>
<input type="file" id="imp" accept=".json,application/json" hidden onchange="importar(this)">
<div id="board"></div>
<button class="fab" onclick="novaTarefa()">+</button>
<datalist id="hist"></datalist>
<div class="modal" id="modal" onclick="if(event.target===this)fechar()"><div class="mc">
  <h3>Opções</h3>
  <button onclick="corTarefa()">🎨 Mudar cor da lista</button>
  <button onclick="notasGerais()">📝 Anotações gerais</button>
  <button onclick="salvarPerfil()">💾 Salvar como perfil</button>
  <button onclick="aplicarPerfil()">✨ Carregar perfil</button>
  <button onclick="excluirTarefa()" style="background:#FEE2E2;color:#EF4444">🗑️ Excluir tudo</button>
  <button onclick="fechar()" style="background:none;text-align:center;color:#9CA3AF">Cancelar</button>
</div></div>
<script>
const KEY='organizador-dados-v1', cores=['default','blue','green','yellow','red','purple'];
let S=carregar(), view_='tarefa', ativo=null, foco=null;
function carregar(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tarefas)return d}catch(e){}return{tarefas:[],historico:[],perfis:[]}}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Erro ao salvar: '+e.message)}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const T=id=>S.tarefas.find(t=>t.id===id), A=(t,a)=>T(t).acoes.find(x=>x.id===a);
function hist(v){v=v.trim();if(v&&!S.historico.includes(v)){S.historico.push(v);atualizaHist()}}
function atualizaHist(){document.getElementById('hist').innerHTML=S.historico.map(h=>`<option value="${esc(h)}">`).join('')}
function view(v){view_=v;['tarefa','compra'].forEach(x=>document.getElementById('v-'+x).classList.toggle('on',x===v));render()}
function render(){
  const b=document.getElementById('board'),ls=S.tarefas.filter(t=>t.tipo===view_);
  atualizaHist();
  if(!ls.length){b.innerHTML=`<div class="empty">Nenhuma ${view_==='compra'?'lista':'tarefa'} ainda.<br>Toque no <b style="color:var(--pr)">+</b> para criar.</div>`;return}
  b.innerHTML=ls.map(card).join('');
  ls.forEach(t=>new Sortable(document.getElementById('l-'+t.id),{handle:'.dh',animation:200,delay:150,delayOnTouchOnly:true,ghostClass:'ghost',
    onEnd:()=>{const ids=[...document.querySelectorAll('#l-'+t.id+' .it')].map(e=>e.dataset.id);t.acoes.forEach(a=>a.ordem=ids.indexOf(a.id));t.acoes.sort((a,b)=>a.ordem-b.ordem);salvar()}}));
  if(foco){const e=document.getElementById(foco);if(e)e.focus();foco=null}
}
function card(t){
  const c=t.tipo==='compra',i=`'${t.id}'`;
  const acoes=t.acoes.map(a=>{const j=`${i},'${a.id}'`;
    const top=`<div class="row"><span class="dh">⠿</span><input type="checkbox" class="ck" ${a.concluido?'checked':''} onchange="toggle(${j})"><input class="in" value="${esc(a.titulo)}" placeholder="${c?'Produto...':'O que fazer?'}" list="hist" onchange="upd(${j},'titulo',this.value)">${c?`<button class="ib" style="background:none" onclick="delA(${j})">✕</button>`:''}</div>`;
    if(c)return`<div class="it cp ${a.concluido?'done':''}" data-id="${a.id}">${top}</div>`;
    return`<div class="it a-${a.cor||'default'} ${a.concluido?'done':''}" data-id="${a.id}">${top}
      <div class="tl"><button class="ib ${a.prioridade?'on':''}" onclick="prio(${j})">🚩</button><button class="ib" onclick="corA(${j})">🎨</button><button class="ib" onclick="document.getElementById('n-${a.id}').classList.toggle('show')">💬</button><button class="ib" onclick="delA(${j})">🗑️</button></div>
      <div class="nt ${a.anotacao?'show':''}" id="n-${a.id}"><textarea rows="3" placeholder="Detalhes..." onchange="upd(${j},'anotacao',this.value)">${esc(a.anotacao)}</textarea></div></div>`}).join('');
  const add=c?`<input class="fast" id="f-${t.id}" placeholder="+ Digite o produto e tecle Enter..." enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();rapido(${i},this)}">`
             :`<button class="add" onclick="novaAcao(${i})">+ Adicionar etapa</button>`;
  return`<div class="card c-${t.cor||'default'}" data-id="${t.id}"><div class="th"><input class="tt" value="${esc(t.titulo)}" placeholder="${c?'Nome da lista':'Título'}" onchange="T(${i}).titulo=this.value;salvar()"><button class="mb" onclick="abrir(${i})">⋯</button></div>
    <div class="list" id="l-${t.id}">${acoes}</div>${add}
    <div class="gn ${t.anotacoes?'show':''}" id="g-${t.id}"><b style="font-size:.85rem;color:var(--mu)">Anotações</b><textarea onchange="T(${i}).anotacoes=this.value;salvar()">${esc(t.anotacoes)}</textarea></div></div>`}
function novaTarefa(){S.tarefas.push({id:uid('T'),titulo:view_==='compra'?'Nova lista de compras':'Nova tarefa',anotacoes:'',cor:'default',tipo:view_,acoes:[]});salvar();render();setTimeout(()=>document.getElementById('board').scrollTo({left:99999,behavior:'smooth'}),100)}
function mk(t,v){return{id:uid('A'),titulo:v||'',anotacao:'',ordem:t.acoes.length,concluido:false,cor:'default',prioridade:false}}
function novaAcao(id){const t=T(id);t.acoes.push(mk(t));salvar();render()}
function rapido(id,el){const v=el.value.trim();if(!v)return;const t=T(id);t.acoes.push(mk(t,v));hist(v);salvar();foco='f-'+id;render()}
function upd(t,a,k,v){A(t,a)[k]=v;if(k==='titulo')hist(v);salvar()}
function toggle(t,a){const x=A(t,a);x.concluido=!x.concluido;salvar();render()}
function prio(t,a){const x=A(t,a);x.prioridade=!x.prioridade;salvar();render()}
function corA(t,a){const x=A(t,a);x.cor=cores[(cores.indexOf(x.cor||'default')+1)%cores.length];salvar();render()}
function delA(t,a){if(document.activeElement)document.activeElement.blur();const x=T(t);x.acoes=x.acoes.filter(i=>i.id!==a);salvar();render()}
function abrir(id){ativo=id;document.getElementById('modal').style.display='flex'}
function fechar(){document.getElementById('modal').style.display='none';ativo=null}
function corTarefa(){const t=T(ativo);t.cor=cores[(cores.indexOf(t.cor||'default')+1)%cores.length];salvar();fechar();render()}
function notasGerais(){const g=document.getElementById('g-'+ativo);g.classList.toggle('show');fechar();if(g.classList.contains('show'))g.querySelector('textarea').focus()}
function excluirTarefa(){if(confirm('Tem certeza que deseja excluir tudo?')){S.tarefas=S.tarefas.filter(t=>t.id!==ativo);salvar();fechar();render()}}
function salvarPerfil(){const t=T(ativo),n=prompt('Nome do perfil:');if(n){S.perfis.push({nome:n,tipo:view_,acoes:JSON.parse(JSON.stringify(t.acoes))});salvar();alert('Perfil salvo!')}fechar()}
function aplicarPerfil(){const ps=S.perfis.filter(p=>p.tipo===view_);if(!ps.length){alert('Nenhum perfil salvo.');return fechar()}
  const n=prompt('Qual perfil carregar?\n\n'+ps.map((p,i)=>`${i+1}: ${p.nome}`).join('\n')),p=ps[n-1];
  if(p){const t=T(ativo);p.acoes.forEach(a=>t.acoes.push({...a,id:uid('A'),ordem:t.acoes.length,concluido:false}));salvar();render()}fechar()}
async function exportar(){
  const f=new File([JSON.stringify(S,null,1)],`organizador-backup-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],title:'Backup Organizador'})}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tarefas))throw 0;
    if(confirm('Isso SUBSTITUI os dados atuais pelo backup. Continuar?')){S={tarefas:d.tarefas,historico:d.historico||[],perfis:d.perfis||[]};salvar();render()}}catch(e){alert('Arquivo de backup inválido.')}inp.value=''};r.readAsText(f)}
render();
</script></body></html>
